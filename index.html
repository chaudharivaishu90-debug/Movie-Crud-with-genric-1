    <div class="backdrop" id="backdrop"></div>
    
         <div class="movieModel" id="movieModel">
            <form id="form" class="form">
            <div class="card">
               <div class="card-header d-flex justify-content-between">
                   <h3>Add Movie</h3>
                   <i class="fa-solid fa-xmark fa-2x" role="button" id="icon"></i>
               </div>
               <div class="card-body">
                  <label for="name">Movie Name:</label>
                  <input type="text" class="form-control" id="name">

                  <label for="image">Movie Image:</label>
                  <input type="text" class="form-control" id="image">

                  <label for="name">Created At:</label>
                  <input type="datetime-local" class="form-control" id="CreatedAt">


                  <label for="name">Discription:</label>
                  <textarea name="" class="form-control" id="discription" rows="2"></textarea>

                  <label for="name">Genre:</label>
                     <input type="text" class="form-control" id="Genre">

                     <label for="name">Date:</label>
                     <input type="date" class="form-control" id="Date">


                  <label for="rating">Rating:</label>
                  <select id="rating" class="form-control">
                     <option value="1">1</option>
                     <option value="2">2</option>
                     <option value="3">3</option>
                     <option value="4">4</option>
                     <option value="5">5</option>
                     <option value="6">6</option>
                     <option value="7">7</option>
                     <option value="8">8</option>
                     <option value="9">9</option>
                     <option value="10">10</option>
                  </select>
                                 </div>

                    <button type ="button" class="btn btn-sm netflix-sec-color d-none" id="updateMovie">Update Movie</button>
                    <button type ="button" class="btn btn-sm netflix-pri-Color" id="closeBtn">Close</button>
                 </div>
